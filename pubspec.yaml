name: flutter_clean_boilerplate
description: A generic Flutter Clean Architecture boilerplate with local (Drift) storage — no backend required.

publish_to: 'none'
version: 1.0.0+0
environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  get_it: ^9.2.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  go_router: ^17.2.3
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  flutter_spinkit: ^5.2.2
  fluttertoast: ^9.1.0
  connectivity_plus: ^7.1.1
  dio: ^5.9.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

  flutter_test:
    sdk: flutter



flutter:
  uses-material-design: true
  config:
    disable-swift-package-manager: true

  assets:
    - assets/images/

  fonts:
    - family: SF-Pro-Rounded-Regular
      fonts:
        - asset: assets/fonts/ubuntu/SF-Pro-Rounded-Regular.ttf
          weight: 400
        - asset: assets/fonts/ubuntu/SF-Pro-Rounded-Regular.ttf
          weight: 500
        - asset: assets/fonts/ubuntu/SF-Pro-Rounded-Regular.ttf
          weight: 600
